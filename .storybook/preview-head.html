<link rel="icon" href="/finch/finchFavicon.ico" type="image/x-icon" />
<!-- Object/array controls in the Docs args table expand one row per element;
     cap their height so large data arrays scroll inside the cell. -->
<style>
    .rejt-tree {
        max-height: 12rem;
        overflow: auto;
    }
    /* Keep long values and their hover buttons on one line, without blank wrapped rows. */
    .rejt-tree li {
        white-space: nowrap;
    }
    /* Storybook indents object/array controls by 1rem, so they start further right
       than the radio, text and select controls in the same column. Align them.
       The element-qualified selector outranks Storybook's own scoped rule. */
    table.docblock-argstable .rejt-tree {
        margin-left: 0;
    }
</style>
